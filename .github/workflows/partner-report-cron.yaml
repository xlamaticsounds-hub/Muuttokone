name: Partner Report Cron

# Kuun 1. päivänä: edellisen kuukauden välityspalkkioraportti (esim. Kiinteistömaailma).
# Esikatselu lähtee vain meille; kumppanille raportti lähetetään vasta kun se hyväksytään
# hallinnassa (/hallinta/raportit). Vaatii samat repo-secretit kuin overdue-invoices-cron.yaml:
# APP_URL (esim. https://www.muuttokone.fi) ja CRON_SECRET.
on:
  schedule:
    - cron: '0 6 1 * *' # kuun 1. päivä klo 06 UTC (08/09 Suomen aikaa)
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/partner-report
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/partner-report" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Cron call failed with status $status"
            exit 1
          fi
